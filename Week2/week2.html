<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMMMSU - Campus Notices</title>
    <link rel="stylesheet" href="week2.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">

    <!-- Header: Logo + DMMMSU -->
    <header class="header">
        <img src="OIP (1).jpg" alt="DMMMSU Logo" class="logo">
        <div class="header-text">
            <h1>DMMMSU</h1>
            <p>Don Mariano Marcos Memorial State University • South La Union Campus</p>
        </div>
    </header>

    <!-- Navigation: Home | About | Contact -->
    <nav class="navbar">
        <a href="#home" class="active">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <!-- Main 2-Column Layout -->
    <main class="main-content">

        <!-- Left: 3 Pictures -->
        <section class="pictures-panel">
            <h3>3 Pictures</h3>
            <div class="three-pics">
                <div class="pic-box">
                    <img src="SlucMain.webp" alt="Campus Picture 1">
                </div>
                <div class="pic-box">
                    <img src="Highschool.webp" alt="Campus Picture 2">
                </div>
                <div class="pic-box">
                    <img src="comscie.jpg" alt="Campus Picture 3">
                </div>
            </div>
        </section>

        <!-- Right: Title, Message, Post Notice -->
        <section class="form-panel">
            <form>
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" placeholder="Enter notice title..." required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" placeholder="Write your message..." required></textarea>
                </div>

                <button type="submit" class="post-btn">Post notice</button>
            </form>
        </section>

    </main>

    <!-- Footer: College of Computer Science -->
    <footer class="footer">
        <p>College of Computer Science</p>
    </footer>

</div>

</body>
</html>
